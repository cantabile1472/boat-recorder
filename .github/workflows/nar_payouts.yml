name: 地方競馬の払戻（全券種）
on:
  workflow_dispatch:
    inputs:
      days:
        description: '日付（スペース区切り、例 20261101 20261102）'
        required: true
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python tools/nar_payouts.py ${{ github.event.inputs.days }}
      - run: |
          git config user.name bot; git config user.email bot@example.com
          git add data/nar_payouts; git commit -qm "地方の払戻 ${{ github.event.inputs.days }}" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
