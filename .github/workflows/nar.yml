name: 地方競馬のデータ取得
on:
  workflow_dispatch:
    inputs:
      months:
        description: '年月（YYYY-M をスペース区切り）。空ならページ調査だけ'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/nar_pilot.py || true
      - run: for m in ${{ github.event.inputs.months }}; do python tools/nar_monthly.py ${m%-*} ${m#*-} || true; done
      - run: |
          git config user.name "recorder-bot"
          git config user.email "recorder-bot@users.noreply.github.com"
          git add data
          git commit -qm "地方競馬のデータ" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
