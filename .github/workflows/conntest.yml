name: 接続テスト
on:
  push:
    paths: ['tools/conntest.py', '.github/workflows/conntest.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/conntest.py
      - name: 結果を保存
        run: |
          git config user.name "recorder-bot"
          git config user.email "recorder-bot@users.noreply.github.com"
          git add test_result.txt
          git commit -m "接続テスト結果" || true
          git push
