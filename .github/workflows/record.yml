name: 締切前オッズの記録
on:
  schedule:
    - cron: '*/30 23,0-14 * * *'   # 日本時間 8:00〜23:30 に30分おき（動いている間は待機して、止まっていたら起動する）
  push:
    paths: ['recorder.py', 'tools/strat_e.py', 'tools/strategy_h.py', 'models/s70_3.pkl', 'tools/strategy_hf.py', 'models/f70_3.pkl', 'tools/strategy_y.py', 'models/y_trio.pkl', 'tools/strategy_h_auto.py', 'models/s70_auto_3.pkl', 'tools/nar_recorder.py', 'tools/keirin_recorder.py', '.github/workflows/record.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: recorder
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 戦略H用のライブラリ（モデルの保存時と同じ版）
        run: pip install -q scikit-learn==1.9.1 pandas numpy
      - name: git の設定
        run: |
          git config user.name "recorder-bot"
          git config user.email "recorder-bot@users.noreply.github.com"
      - name: 最新のデータを取ってくる
        run: git pull -q origin main
      - name: 記録する
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ORDER_TOPIC: ${{ secrets.ORDER_TOPIC }}
          START_NOTIFY: '1'
        run: |
          python tools/nar_recorder.py > nar_log.txt 2>&1 &
          python tools/keirin_recorder.py > keirin_log.txt 2>&1 &
          python recorder.py
          wait
          tail -20 nar_log.txt || true
          tail -20 keirin_log.txt || true
      - name: 最後に保存
        if: always()
        run: |
          python tools/eval_e.py $(TZ=Asia/Tokyo date +%Y%m%d) > /dev/null 2>&1 || true
          python tools/eval_e.py $(TZ=Asia/Tokyo date +%Y%m%d) all > /dev/null 2>&1 || true
          python tools/drop_table.py check $(TZ=Asia/Tokyo date +%Y%m%d) > /dev/null 2>&1 || true
          git add data || true
          git commit -qm "記録（最終保存）" || true
          git pull -q --rebase -X theirs origin main || true
          git push -q origin HEAD:main || true
      - name: 次の回をすぐ予約（24時間つなげて、すき間をなくす）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run record.yml --ref main || true
