name: 締切前オッズの記録
on:
  schedule:
    - cron: '*/30 23,0-14 * * *'   # 日本時間 8:00〜23:30 に30分おき（動いている間は待機して、止まっていたら起動する）
  push:
    paths: ['recorder.py', '.github/workflows/record.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recorder
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: git の設定
        run: |
          git config user.name "recorder-bot"
          git config user.email "recorder-bot@users.noreply.github.com"
      - name: 最新のデータを取ってくる
        run: git pull -q origin main
      - name: 記録する
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          START_NOTIFY: '1'
        run: python recorder.py
      - name: 最後に保存
        if: always()
        run: |
          git add data || true
          git commit -qm "記録（最終保存）" || true
          git pull -q --rebase -X theirs origin main || true
          git push -q origin HEAD:main || true
