name: 地方競馬 出馬表
on:
  workflow_dispatch:
    inputs:
      month:
        description: '月（1〜12、スペース区切りで複数可）'
        required: true
      year:
        description: '年'
        required: false
        default: '2026'
      day:
        description: '日（YYYYMMDD、スペース区切りで複数可。指定すると月は無視してその日だけ）'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            for d in ${{ github.event.inputs.day }}; do python tools/nar_cards.py ${d:0:4} $((10#${d:4:2})) $d || true; done
          else
            for m in ${{ github.event.inputs.month }}; do python tools/nar_cards.py ${{ github.event.inputs.year }} $m || true; done
          fi
      - run: |
          git config user.name "recorder-bot"; git config user.email "recorder-bot@users.noreply.github.com"
          git add data/nar && git commit -qm "地方競馬 出馬表 ${{ github.event.inputs.year }}/${{ github.event.inputs.month }}" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
